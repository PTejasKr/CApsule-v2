replicaCount: 1

image:
  repository: capsule-api
  pullPolicy: IfNotPresent
  tag: "latest"

service:
  type: ClusterIP
  port: 8000

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []

resources:
  limits:
    cpu: 1000m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 256Mi

env:
  DATABASE_URL: "sqlite+aiosqlite:///./data/capsule.db"
  REDIS_HOST: "redis"

persistence:
  enabled: true
  size: 5Gi
  accessMode: ReadWriteOnce
